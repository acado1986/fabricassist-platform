[project]
name = "fabricassist"
version = "0.0.0"
description = "FabricAssist backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<1.15",
  "argon2-cffi>=23.1,<24",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<5.5",
  "email-validator>=2.2,<3",
  "fastapi>=0.139,<0.140",
  "httpx>=0.28,<0.29",
  "opentelemetry-api>=1.44,<1.45",
  "opentelemetry-exporter-otlp-proto-http>=1.44,<1.45",
  "opentelemetry-instrumentation-celery>=0.65b0,<0.66",
  "opentelemetry-instrumentation-fastapi>=0.65b0,<0.66",
  "opentelemetry-sdk>=1.44,<1.45",
  "pillow>=12.3,<13",
  "prometheus-client>=0.21,<0.22",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic-settings>=2.7,<2.8",
  "pyjwt>=2.10,<3",
  "redis>=5.3,<6",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<0.35",
  "zxing-cpp>=2.3,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "httpx2>=2,<3",
  "pyright>=1.1.391,<1.2",
  "pytest>=8.3,<8.4",
  "pytest-asyncio>=0.25,<0.26",
  "ruff>=0.9,<0.10",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabricassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires local Compose infrastructure",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnusedFunction = "none"
venvPath = "."
venv = ".venv"
