[project]
name = "fabricassist"
version = "0.0.0"
description = "FabricAssist backend foundation"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<0.116",
  "psycopg[binary]>=3.2,<3.3",
  "pydantic-settings>=2.7,<2.8",
  "sqlalchemy>=2.0.36,<2.1",
  "uvicorn[standard]>=0.34,<0.35",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pyright>=1.1.391,<1.2",
  "pytest>=8.3,<8.4",
  "pytest-asyncio>=0.25,<0.26",
  "ruff>=0.9,<0.10",
]

[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fabricassist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"
reportMissingTypeStubs = false
reportUnusedFunction = "none"
venvPath = "."
venv = ".venv"
