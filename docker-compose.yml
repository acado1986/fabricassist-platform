name: fabricassist

x-fabricassist-postgres-environment: &fabricassist-postgres-environment
  POSTGRES_DB: ${FABRICASSIST_POSTGRES_DB:-fabricassist_dev}
  POSTGRES_USER: ${FABRICASSIST_POSTGRES_USER:-fabricassist_dev}
  POSTGRES_PASSWORD: ${FABRICASSIST_POSTGRES_PASSWORD:-change-me-local-postgres}

x-fabricassist-minio-environment: &fabricassist-minio-environment
  MINIO_ROOT_USER: ${FABRICASSIST_S3_ACCESS_KEY:-fabricassist-local}
  MINIO_ROOT_PASSWORD: ${FABRICASSIST_S3_SECRET_KEY:-change-me-local-minio}

services:
  fabricassist-postgres:
    image: pgvector/pgvector:0.8.0-pg17
    environment: *fabricassist-postgres-environment
    ports:
      - "${FABRICASSIST_POSTGRES_PORT:-5432}:5432"
    volumes:
      - fabricassist-postgres-data:/var/lib/postgresql/data
    networks: [fabricassist-network]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  fabricassist-valkey:
    image: valkey/valkey:8.1.3-alpine
    command: [valkey-server, --appendonly, 'yes']
    ports:
      - "${FABRICASSIST_VALKEY_PORT:-6379}:6379"
    volumes:
      - fabricassist-valkey-data:/data
    networks: [fabricassist-network]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  fabricassist-minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment: *fabricassist-minio-environment
    ports:
      - "${FABRICASSIST_MINIO_API_PORT:-9000}:9000"
      - "${FABRICASSIST_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - fabricassist-minio-data:/data
    networks: [fabricassist-network]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  fabricassist-minio-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    environment:
      # This one-shot container is inside the Compose network. It must use the
      # service DNS name rather than the client-facing presign endpoint, which
      # may be localhost for ADB-reversed physical-device development.
      FABRICASSIST_S3_PUBLIC_ENDPOINT_URL: http://fabricassist-minio:9000
      FABRICASSIST_S3_ACCESS_KEY: ${FABRICASSIST_S3_ACCESS_KEY:-fabricassist-local}
      FABRICASSIST_S3_SECRET_KEY: ${FABRICASSIST_S3_SECRET_KEY:-change-me-local-minio}
      FABRICASSIST_S3_BUCKET: ${FABRICASSIST_S3_BUCKET:-fabricassist-local}
    networks: [fabricassist-network]
    depends_on:
      fabricassist-minio:
        condition: service_healthy
    entrypoint: [/bin/sh, /usr/local/bin/initialize-bucket.sh]
    volumes:
      - ./infrastructure/compose/minio/initialize-bucket.sh:/usr/local/bin/initialize-bucket.sh:ro
    restart: 'no'

  fabricassist-api:
    build:
      context: ./backend
    environment:
      FABRICASSIST_ENVIRONMENT: ${FABRICASSIST_ENVIRONMENT:-development}
      FABRICASSIST_DEPLOYMENT_PROFILE: ${FABRICASSIST_DEPLOYMENT_PROFILE:-local}
      FABRICASSIST_JOB_DISPATCHER: ${FABRICASSIST_JOB_DISPATCHER:-celery}
      FABRICASSIST_QSTASH_TOKEN: ${FABRICASSIST_QSTASH_TOKEN:-}
      FABRICASSIST_QSTASH_CURRENT_SIGNING_KEY: ${FABRICASSIST_QSTASH_CURRENT_SIGNING_KEY:-}
      FABRICASSIST_QSTASH_NEXT_SIGNING_KEY: ${FABRICASSIST_QSTASH_NEXT_SIGNING_KEY:-}
      FABRICASSIST_QSTASH_DESTINATION_URL: ${FABRICASSIST_QSTASH_DESTINATION_URL:-}
      FABRICASSIST_HOT_CACHE_BACKEND: ${FABRICASSIST_HOT_CACHE_BACKEND:-valkey}
      FABRICASSIST_RATE_LIMITER_BACKEND: ${FABRICASSIST_RATE_LIMITER_BACKEND:-valkey}
      FABRICASSIST_CONCURRENCY_GATE_BACKEND: ${FABRICASSIST_CONCURRENCY_GATE_BACKEND:-valkey}
      FABRICASSIST_LOG_LEVEL: ${FABRICASSIST_LOG_LEVEL:-INFO}
      FABRICASSIST_ACCESS_TOKEN_SECRET: ${FABRICASSIST_ACCESS_TOKEN_SECRET:-change-me-local-access-secret-please-replace}
      FABRICASSIST_APP_BASE_URL: ${FABRICASSIST_APP_BASE_URL:-http://localhost:8081}
      FABRICASSIST_API_PUBLIC_URL: ${FABRICASSIST_API_PUBLIC_URL:-http://localhost:8000}
      FABRICASSIST_CORS_ALLOWED_ORIGINS: ${FABRICASSIST_CORS_ALLOWED_ORIGINS:-http://localhost:8081,http://localhost:19006}
      FABRICASSIST_METRICS_ENABLED: ${FABRICASSIST_METRICS_ENABLED:-true}
      FABRICASSIST_METRICS_ACCESS_TOKEN: ${FABRICASSIST_METRICS_ACCESS_TOKEN:-}
      FABRICASSIST_OTEL_EXPORTER_OTLP_ENDPOINT: ${FABRICASSIST_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      FABRICASSIST_OTEL_SERVICE_NAME: fabricassist-api
      FABRICASSIST_RATE_LIMIT_ENABLED: ${FABRICASSIST_RATE_LIMIT_ENABLED:-true}
      FABRICASSIST_RATE_LIMIT_FAIL_OPEN: ${FABRICASSIST_RATE_LIMIT_FAIL_OPEN:-true}
      FABRICASSIST_RATE_LIMIT_GLOBAL_PER_MINUTE: ${FABRICASSIST_RATE_LIMIT_GLOBAL_PER_MINUTE:-600}
      FABRICASSIST_RATE_LIMIT_AUTH_PER_MINUTE: ${FABRICASSIST_RATE_LIMIT_AUTH_PER_MINUTE:-10}
      FABRICASSIST_RATE_LIMIT_ANALYSIS_PER_MINUTE: ${FABRICASSIST_RATE_LIMIT_ANALYSIS_PER_MINUTE:-10}
      FABRICASSIST_RATE_LIMIT_CHAT_PER_MINUTE: ${FABRICASSIST_RATE_LIMIT_CHAT_PER_MINUTE:-20}
      FABRICASSIST_DATABASE_URL: ${FABRICASSIST_DATABASE_URL:-postgresql://fabricassist_dev:change-me-local-postgres@fabricassist-postgres:5432/fabricassist_dev}
      FABRICASSIST_VALKEY_URL: ${FABRICASSIST_VALKEY_URL:-valkey://fabricassist-valkey:6379/0}
      FABRICASSIST_CELERY_BROKER_URL: ${FABRICASSIST_CELERY_BROKER_URL:-redis://fabricassist-valkey:6379/0}
      FABRICASSIST_S3_ENDPOINT_URL: ${FABRICASSIST_S3_ENDPOINT_URL:-http://fabricassist-minio:9000}
      FABRICASSIST_S3_PUBLIC_ENDPOINT_URL: ${FABRICASSIST_S3_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      FABRICASSIST_S3_ACCESS_KEY: ${FABRICASSIST_S3_ACCESS_KEY:-fabricassist-local}
      FABRICASSIST_S3_SECRET_KEY: ${FABRICASSIST_S3_SECRET_KEY:-change-me-local-minio}
      FABRICASSIST_S3_BUCKET: ${FABRICASSIST_S3_BUCKET:-fabricassist-local}
      FABRICASSIST_S3_FORCE_PATH_STYLE: ${FABRICASSIST_S3_FORCE_PATH_STYLE:-true}
      FABRICASSIST_ANALYSIS_LEASE_MINUTES: ${FABRICASSIST_ANALYSIS_LEASE_MINUTES:-5}
      FABRICASSIST_PUBLICATION_RECOVERY_INTERVAL_SECONDS: ${FABRICASSIST_PUBLICATION_RECOVERY_INTERVAL_SECONDS:-30}
      FABRICASSIST_PUBLICATION_RECOVERY_BATCH_SIZE: ${FABRICASSIST_PUBLICATION_RECOVERY_BATCH_SIZE:-100}
      FABRICASSIST_DELETION_MAX_ATTEMPTS: ${FABRICASSIST_DELETION_MAX_ATTEMPTS:-5}
      FABRICASSIST_MERGED_GARMENT_RETENTION_DAYS: ${FABRICASSIST_MERGED_GARMENT_RETENTION_DAYS:-30}
      FABRICASSIST_EVIDENCE_PROVIDER: ${FABRICASSIST_EVIDENCE_PROVIDER:-mock}
      FABRICASSIST_CARE_PLANNER_PROVIDER: ${FABRICASSIST_CARE_PLANNER_PROVIDER:-mock}
      FABRICASSIST_CHAT_PROVIDER: ${FABRICASSIST_CHAT_PROVIDER:-mock}
      FABRICASSIST_OBJECT_STORAGE_BACKEND: ${FABRICASSIST_OBJECT_STORAGE_BACKEND:-s3}
      FABRICASSIST_OPENAI_RESPONSES_BASE_URL: ${FABRICASSIST_OPENAI_RESPONSES_BASE_URL:-}
      FABRICASSIST_OPENAI_RESPONSES_API_KEY: ${FABRICASSIST_OPENAI_RESPONSES_API_KEY:-}
      FABRICASSIST_OPENAI_RESPONSES_MODEL: ${FABRICASSIST_OPENAI_RESPONSES_MODEL:-}
      FABRICASSIST_OPENAI_RESPONSES_EXTRA_HEADERS_JSON: '${FABRICASSIST_OPENAI_RESPONSES_EXTRA_HEADERS_JSON:-{}}'
      FABRICASSIST_VISION_TIMEOUT_SECONDS: ${FABRICASSIST_VISION_TIMEOUT_SECONDS:-120}
      FABRICASSIST_VISION_MAX_INPUT_TOKENS: ${FABRICASSIST_VISION_MAX_INPUT_TOKENS:-128000}
      FABRICASSIST_VISION_MAX_OUTPUT_TOKENS: ${FABRICASSIST_VISION_MAX_OUTPUT_TOKENS:-16000}
      FABRICASSIST_VISION_DEBUG_LOGGING: ${FABRICASSIST_VISION_DEBUG_LOGGING:-false}
      FABRICASSIST_GEMINI_API_KEY: ${FABRICASSIST_GEMINI_API_KEY:-}
      FABRICASSIST_GEMINI_MODEL: ${FABRICASSIST_GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "${FABRICASSIST_API_PORT:-8000}:8000"
    networks: [fabricassist-network]
    depends_on:
      fabricassist-postgres:
        condition: service_healthy
      fabricassist-valkey:
        condition: service_healthy
      fabricassist-minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/live')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  fabricassist-worker:
    build:
      context: ./backend
    command: [celery, -A, fabricassist.worker.celery_app:celery_app, worker, --loglevel=INFO]
    environment:
      FABRICASSIST_ENVIRONMENT: ${FABRICASSIST_ENVIRONMENT:-development}
      FABRICASSIST_DEPLOYMENT_PROFILE: ${FABRICASSIST_DEPLOYMENT_PROFILE:-local}
      FABRICASSIST_JOB_DISPATCHER: ${FABRICASSIST_JOB_DISPATCHER:-celery}
      FABRICASSIST_QSTASH_TOKEN: ${FABRICASSIST_QSTASH_TOKEN:-}
      FABRICASSIST_QSTASH_CURRENT_SIGNING_KEY: ${FABRICASSIST_QSTASH_CURRENT_SIGNING_KEY:-}
      FABRICASSIST_QSTASH_NEXT_SIGNING_KEY: ${FABRICASSIST_QSTASH_NEXT_SIGNING_KEY:-}
      FABRICASSIST_QSTASH_DESTINATION_URL: ${FABRICASSIST_QSTASH_DESTINATION_URL:-}
      FABRICASSIST_HOT_CACHE_BACKEND: ${FABRICASSIST_HOT_CACHE_BACKEND:-valkey}
      FABRICASSIST_RATE_LIMITER_BACKEND: ${FABRICASSIST_RATE_LIMITER_BACKEND:-valkey}
      FABRICASSIST_CONCURRENCY_GATE_BACKEND: ${FABRICASSIST_CONCURRENCY_GATE_BACKEND:-valkey}
      FABRICASSIST_LOG_LEVEL: ${FABRICASSIST_LOG_LEVEL:-INFO}
      FABRICASSIST_OTEL_EXPORTER_OTLP_ENDPOINT: ${FABRICASSIST_OTEL_EXPORTER_OTLP_ENDPOINT:-}
      FABRICASSIST_OTEL_SERVICE_NAME: fabricassist-worker
      FABRICASSIST_WORKER_GLOBAL_CONCURRENCY: ${FABRICASSIST_WORKER_GLOBAL_CONCURRENCY:-8}
      FABRICASSIST_WORKER_TENANT_CONCURRENCY: ${FABRICASSIST_WORKER_TENANT_CONCURRENCY:-2}
      FABRICASSIST_WORKER_CONCURRENCY_LEASE_SECONDS: ${FABRICASSIST_WORKER_CONCURRENCY_LEASE_SECONDS:-300}
      FABRICASSIST_DATABASE_URL: ${FABRICASSIST_DATABASE_URL:-postgresql://fabricassist_dev:change-me-local-postgres@fabricassist-postgres:5432/fabricassist_dev}
      FABRICASSIST_VALKEY_URL: ${FABRICASSIST_VALKEY_URL:-valkey://fabricassist-valkey:6379/0}
      FABRICASSIST_CELERY_BROKER_URL: ${FABRICASSIST_CELERY_BROKER_URL:-redis://fabricassist-valkey:6379/0}
      FABRICASSIST_S3_ENDPOINT_URL: ${FABRICASSIST_S3_ENDPOINT_URL:-http://fabricassist-minio:9000}
      FABRICASSIST_S3_ACCESS_KEY: ${FABRICASSIST_S3_ACCESS_KEY:-fabricassist-local}
      FABRICASSIST_S3_SECRET_KEY: ${FABRICASSIST_S3_SECRET_KEY:-change-me-local-minio}
      FABRICASSIST_S3_BUCKET: ${FABRICASSIST_S3_BUCKET:-fabricassist-local}
      FABRICASSIST_S3_FORCE_PATH_STYLE: ${FABRICASSIST_S3_FORCE_PATH_STYLE:-true}
      FABRICASSIST_ANALYSIS_LEASE_MINUTES: ${FABRICASSIST_ANALYSIS_LEASE_MINUTES:-5}
      FABRICASSIST_PUBLICATION_RECOVERY_INTERVAL_SECONDS: ${FABRICASSIST_PUBLICATION_RECOVERY_INTERVAL_SECONDS:-30}
      FABRICASSIST_PUBLICATION_RECOVERY_BATCH_SIZE: ${FABRICASSIST_PUBLICATION_RECOVERY_BATCH_SIZE:-100}
      FABRICASSIST_DELETION_MAX_ATTEMPTS: ${FABRICASSIST_DELETION_MAX_ATTEMPTS:-5}
      FABRICASSIST_MERGED_GARMENT_RETENTION_DAYS: ${FABRICASSIST_MERGED_GARMENT_RETENTION_DAYS:-30}
      FABRICASSIST_EVIDENCE_PROVIDER: ${FABRICASSIST_EVIDENCE_PROVIDER:-mock}
      FABRICASSIST_CARE_PLANNER_PROVIDER: ${FABRICASSIST_CARE_PLANNER_PROVIDER:-mock}
      FABRICASSIST_CHAT_PROVIDER: ${FABRICASSIST_CHAT_PROVIDER:-mock}
      FABRICASSIST_OBJECT_STORAGE_BACKEND: ${FABRICASSIST_OBJECT_STORAGE_BACKEND:-s3}
      FABRICASSIST_OPENAI_RESPONSES_BASE_URL: ${FABRICASSIST_OPENAI_RESPONSES_BASE_URL:-}
      FABRICASSIST_OPENAI_RESPONSES_API_KEY: ${FABRICASSIST_OPENAI_RESPONSES_API_KEY:-}
      FABRICASSIST_OPENAI_RESPONSES_MODEL: ${FABRICASSIST_OPENAI_RESPONSES_MODEL:-}
      FABRICASSIST_OPENAI_RESPONSES_EXTRA_HEADERS_JSON: '${FABRICASSIST_OPENAI_RESPONSES_EXTRA_HEADERS_JSON:-{}}'
      FABRICASSIST_VISION_TIMEOUT_SECONDS: ${FABRICASSIST_VISION_TIMEOUT_SECONDS:-120}
      FABRICASSIST_VISION_MAX_INPUT_TOKENS: ${FABRICASSIST_VISION_MAX_INPUT_TOKENS:-128000}
      FABRICASSIST_VISION_MAX_OUTPUT_TOKENS: ${FABRICASSIST_VISION_MAX_OUTPUT_TOKENS:-16000}
      FABRICASSIST_VISION_DEBUG_LOGGING: ${FABRICASSIST_VISION_DEBUG_LOGGING:-false}
      FABRICASSIST_GEMINI_API_KEY: ${FABRICASSIST_GEMINI_API_KEY:-}
      FABRICASSIST_GEMINI_MODEL: ${FABRICASSIST_GEMINI_MODEL:-gemini-2.5-flash}
    networks: [fabricassist-network]
    depends_on:
      fabricassist-postgres:
        condition: service_healthy
      fabricassist-valkey:
        condition: service_healthy
      fabricassist-minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  fabricassist-otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    profiles: [observability]
    command: [--config=/etc/otelcol-contrib/config.yaml]
    volumes:
      - ./infrastructure/compose/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${FABRICASSIST_OTEL_HTTP_PORT:-4318}:4318"
    networks: [fabricassist-network]
    restart: unless-stopped

  fabricassist-prometheus:
    image: prom/prometheus:v3.2.1
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./infrastructure/compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/compose/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - fabricassist-prometheus-data:/prometheus
    ports:
      - "${FABRICASSIST_PROMETHEUS_PORT:-9090}:9090"
    networks: [fabricassist-network]
    depends_on:
      fabricassist-api:
        condition: service_healthy
    restart: unless-stopped

  fabricassist-grafana:
    image: grafana/grafana:11.5.2
    profiles: [observability]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_USER: ${FABRICASSIST_GRAFANA_ADMIN_USER:-fabricassist-local}
      GF_SECURITY_ADMIN_PASSWORD: ${FABRICASSIST_GRAFANA_ADMIN_PASSWORD:-change-me-local-grafana}
    volumes:
      - ./infrastructure/compose/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/compose/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - fabricassist-grafana-data:/var/lib/grafana
    ports:
      - "${FABRICASSIST_GRAFANA_PORT:-3000}:3000"
    networks: [fabricassist-network]
    depends_on:
      - fabricassist-prometheus
    restart: unless-stopped

  fabricassist-postgres-test:
    image: pgvector/pgvector:0.8.0-pg17
    profiles: [test]
    environment:
      POSTGRES_DB: fabricassist_test
      POSTGRES_USER: fabricassist_test
      POSTGRES_PASSWORD: change-me-local-postgres-test
    ports:
      - "${FABRICASSIST_POSTGRES_TEST_PORT:-5433}:5432"
    volumes:
      - fabricassist-postgres-test-data:/var/lib/postgresql/data
    networks: [fabricassist-test-network]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  fabricassist-valkey-test:
    image: valkey/valkey:8.1.3-alpine
    profiles: [test]
    command: [valkey-server, --appendonly, 'no']
    networks: [fabricassist-test-network]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 10

  fabricassist-minio-test:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: [test]
    command: server /data
    environment:
      MINIO_ROOT_USER: fabricassist-test
      MINIO_ROOT_PASSWORD: change-me-local-minio-test
    volumes:
      - fabricassist-minio-test-data:/data
    ports:
      - "${FABRICASSIST_MINIO_TEST_PORT:-9002}:9000"
    networks: [fabricassist-test-network]
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 5s
      timeout: 5s
      retries: 10

  fabricassist-minio-test-init:
    image: minio/mc:RELEASE.2025-05-21T01-59-54Z
    profiles: [test]
    depends_on:
      fabricassist-minio-test:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: fabricassist-test
      MINIO_ROOT_PASSWORD: change-me-local-minio-test
      FABRICASSIST_S3_BUCKET: fabricassist-test
    entrypoint: [/bin/sh, -ec]
    command:
      - >-
        mc alias set fabricassist-test http://fabricassist-minio-test:9000
        "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "fabricassist-test/$${FABRICASSIST_S3_BUCKET}" &&
        mc anonymous set none "fabricassist-test/$${FABRICASSIST_S3_BUCKET}"
    networks: [fabricassist-test-network]

networks:
  fabricassist-network:
    name: fabricassist-network
  fabricassist-test-network:
    name: fabricassist-test-network

volumes:
  fabricassist-postgres-data:
  fabricassist-valkey-data:
  fabricassist-minio-data:
  fabricassist-postgres-test-data:
  fabricassist-minio-test-data:
  fabricassist-prometheus-data:
  fabricassist-grafana-data:
