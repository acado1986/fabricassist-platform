query GarmentDetail(
  $garmentId: UUID!
  $first: Int!
  $after: String
  $language: String!
) {
  garmentDetail(
    id: $garmentId
    first: $first
    after: $after
    language: $language
  ) {
    id
    displayName
    identifiers
    thumbnailScanId
    thumbnailImageId
    lastAnalysisAt
    analysedBefore
    cleanedBefore
    activeAnalysis {
      id
      scanId
      status
      revisionNumber
      createdAt
    }
    activeResult {
      id
      status
      result {
        outcome
        category
        overallCondition
        allowedActions {
          code
          permission
          maximumTemperatureC
        }
        prohibitedActions {
          code
          permission
          maximumTemperatureC
        }
        uncertainties
        conflicts {
          id
          fieldPath
          severity
          explanationKey
        }
      }
    }
    analyses {
      items {
        scanId
        status
        createdAt
        resultAvailable
        thumbnailScanId
        thumbnailImageId
      }
      pageInfo {
        nextCursor
      }
    }
    serviceEvents {
      id
      kind
      note
      createdAt
    }
    observations {
      id
      observationType
      stability
      authority
      value
      evidenceIds
      confidence
      analysisRevisionId
      supersedesObservationId
      createdAt
    }
  }
}
