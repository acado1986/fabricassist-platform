query GarmentHistory($first: Int!, $after: String) {
  garmentHistory(first: $first, after: $after) {
    items {
      id
      identifiers
      thumbnailUrl
      thumbnailScanId
      thumbnailImageId
      lastAnalysisAt
      analysedBefore
      cleanedBefore
    }
    pageInfo {
      nextCursor
    }
  }
}
