name: Deploy alpha

on:
  push:
    tags:
      - "v*-alpha*"
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to deploy
        required: true
        type: string

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-alpha-${{ inputs.ref || github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      git_sha: ${{ steps.revision.outputs.git_sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Install toolchains
        run: |
          python3 -m pip install --user uv==0.11.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Run deterministic deployment quality checks
        run: |
          make check
          make check-alpha-config
          make test-qstash
          make test-migrations
          make test-object-storage
          make check-openapi-drift
          make build-alpha-web
          make check-alpha-workflows
      - id: revision
        name: Record selected revision
        run: echo "git_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  migrate:
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: alpha
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.quality.outputs.git_sha }}
      - name: Install uv
        run: |
          python3 -m pip install --user uv==0.11.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Apply backward-compatible migrations
        env:
          FABRICASSIST_DATABASE_MIGRATION_URL: ${{ secrets.FABRICASSIST_DATABASE_MIGRATION_URL }}
        run: ./infrastructure/scripts/run-alpha-migrations.sh

  deploy-api:
    needs: [quality, migrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: alpha
    steps:
      - name: Deploy selected API revision to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SELECTED_SHA: ${{ needs.quality.outputs.git_sha }}
        run: |
          curl --fail --silent --show-error --get \
            --data-urlencode "ref=${SELECTED_SHA}" \
            "$RENDER_DEPLOY_HOOK_URL" > /dev/null
      - name: Wait for API liveness and readiness
        env:
          FABRICASSIST_ALPHA_API_URL: ${{ vars.FABRICASSIST_API_URL }}
          SELECTED_SHA: ${{ needs.quality.outputs.git_sha }}
        run: |
          for attempt in $(seq 1 60); do
            headers="$(mktemp)"
            if curl --fail --silent --show-error \
                --dump-header "$headers" \
                --output /dev/null \
                "$FABRICASSIST_ALPHA_API_URL/api/v1/health/live" \
              && grep --ignore-case --quiet \
                "^X-FabricAssist-Revision: ${SELECTED_SHA}" "$headers" \
              && curl --fail --silent --show-error \
                "$FABRICASSIST_ALPHA_API_URL/api/v1/health/ready" > /dev/null; then
              rm -f "$headers"
              exit 0
            fi
            rm -f "$headers"
            sleep 10
          done
          echo "Selected Render API revision did not become ready within 10 minutes." >&2
          exit 1

  deploy-web:
    needs: [quality, migrate]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: alpha
    steps:
      - name: Check out selected revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.quality.outputs.git_sha }}
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Export static web application
        env:
          EXPO_PUBLIC_FABRICASSIST_API_URL: ${{ vars.FABRICASSIST_API_URL }}
          EXPO_PUBLIC_FABRICASSIST_ENVIRONMENT: alpha
        run: pnpm --dir frontend build:web
      - name: Verify generated bundle contains no secret markers
        run: make check-web-bundle-secrets
      - name: Deploy frontend to Cloudflare Pages
        id: deploy-pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy frontend/apps/client/dist
            --project-name=fabricassist-alpha
            --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Record deployed Pages URL
        env:
          DEPLOYMENT_URL: ${{ steps.deploy-pages.outputs.deployment-url }}
        run: |
          echo "Cloudflare Pages deployment: $DEPLOYMENT_URL" >> "$GITHUB_STEP_SUMMARY"

  live-smoke:
    needs: [deploy-api, deploy-web]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: alpha
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.quality.outputs.git_sha }}
      - name: Run hosted mock-provider smoke
        env:
          FABRICASSIST_ALPHA_API_URL: ${{ vars.FABRICASSIST_API_URL }}
          FABRICASSIST_ALPHA_SMOKE_EMAIL: ${{ secrets.FABRICASSIST_ALPHA_SMOKE_EMAIL }}
          FABRICASSIST_ALPHA_SMOKE_PASSWORD: ${{ secrets.FABRICASSIST_ALPHA_SMOKE_PASSWORD }}
        run: make alpha-live-smoke
