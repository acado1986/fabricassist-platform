name: Repository, backend, and frontend foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Validate Phase 3 foundation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install uv
        run: |
          python3 -m pip install --user uv==0.11.2
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate
      - name: Validate repository foundation
        run: make check
      - name: Validate clean patch whitespace
        run: git diff --check
