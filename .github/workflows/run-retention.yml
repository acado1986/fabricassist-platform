name: Run retention

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: retention-production
  cancel-in-progress: false

jobs:
  retention:
    name: Execute retention script
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install uv
        run: python -m pip install --user uv==0.11.2

      - name: Install dependencies
        run: uv sync --frozen --no-dev

      - name: Run retention
        env:
          FABRICASSIST_ENVIRONMENT: production
          FABRICASSIST_DEPLOYMENT_PROFILE: production
          FABRICASSIST_DATABASE_URL: ${{ secrets.FABRICASSIST_DATABASE_URL }}
          FABRICASSIST_MERGED_GARMENT_RETENTION_DAYS: ${{ vars.FABRICASSIST_MERGED_GARMENT_RETENTION_DAYS }}
          FABRICASSIST_S3_ENDPOINT_URL: ${{ secrets.FABRICASSIST_S3_ENDPOINT_URL }}
          FABRICASSIST_S3_REGION: auto
          FABRICASSIST_S3_ACCESS_KEY: ${{ secrets.FABRICASSIST_S3_ACCESS_KEY }}
          FABRICASSIST_S3_SECRET_KEY: ${{ secrets.FABRICASSIST_S3_SECRET_KEY }}
          FABRICASSIST_S3_BUCKET: ${{ secrets.FABRICASSIST_S3_BUCKET }}
          FABRICASSIST_S3_FORCE_PATH_STYLE: "false"
        run: uv run python scripts/run_retention.py
