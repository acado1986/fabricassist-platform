type AiRunType {
  id: UUID!
  scanId: UUID!
  operation: String!
  status: String!
  errorCode: String
  createdAt: DateTime!
  startedAt: DateTime
  completedAt: DateTime
}

type AnalysisRevisionType {
  id: UUID!
  scanId: UUID!
  status: String!
  revisionNumber: Int!
  createdAt: DateTime!
}

type CareResultType {
  id: UUID!
  status: String!
  language: String!
  data: JSON!
}

type ConversationMessageConnection {
  items: [ConversationMessageType!]!
  pageInfo: PageInfo!
}

type ConversationMessageType {
  id: UUID!
  role: String!
  status: String!
  text: String!
  createdAt: DateTime!
}

type CurrentUserType {
  id: UUID!
  email: String!
  role: String!
  preferredLanguage: String!
}

"""Date with time (isoformat)"""
scalar DateTime

type GarmentAnalysisHistoryConnection {
  items: [GarmentAnalysisHistoryType!]!
  pageInfo: PageInfo!
}

type GarmentAnalysisHistoryType {
  scanId: UUID!
  status: String!
  createdAt: DateTime!
  resultAvailable: Boolean!
  thumbnailScanId: UUID
  thumbnailImageId: UUID
}

type GarmentConnection {
  items: [GarmentType!]!
  pageInfo: PageInfo!
}

type GarmentDetailType {
  id: UUID!
  displayName: String
  identifiers: [String!]!
  thumbnailScanId: UUID
  thumbnailImageId: UUID
  lastAnalysisAt: DateTime
  analysedBefore: Boolean!
  cleanedBefore: Boolean!
  activeAnalysis: AnalysisRevisionType
  activeResult: CareResultType
  analyses: GarmentAnalysisHistoryConnection!
  serviceEvents: [ServiceEventType!]!
}

type GarmentHistoryConnection {
  items: [GarmentHistoryItemType!]!
  pageInfo: PageInfo!
}

type GarmentHistoryItemType {
  id: UUID!
  identifiers: [String!]!
  thumbnailUrl: String
  thumbnailScanId: UUID
  thumbnailImageId: UUID
  lastAnalysisAt: DateTime
  analysedBefore: Boolean!
  cleanedBefore: Boolean!
}

type GarmentType {
  id: UUID!
  displayName: String
  archivedAt: DateTime
  activeResultId: UUID
  createdAt: DateTime!
}

type IdentityCandidateType {
  id: UUID!
  garmentId: UUID!
  thumbnailScanId: UUID
  thumbnailImageId: UUID
  classification: String!
  reasons: JSON!
  status: String!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

type PageInfo {
  nextCursor: String
}

type Query {
  currentUser: CurrentUserType!
  scans(first: Int! = 20, after: String = null): ScanConnection!
  scan(id: UUID!): ScanType
  garments(first: Int! = 20, after: String = null): GarmentConnection!
  garmentHistory(first: Int! = 20, after: String = null): GarmentHistoryConnection!
  garment(id: UUID!): GarmentType
  garmentDetail(id: UUID!, first: Int! = 20, after: String = null, language: String = null): GarmentDetailType
  messages(scanId: UUID!, first: Int! = 30, after: String = null): ConversationMessageConnection!
  analysisRevision(id: UUID!): AnalysisRevisionType
  analysis(id: UUID!): AnalysisRevisionType
  imageMetadata(scanId: UUID!): [ScanImageMetadataType!]!
  run(id: UUID!): AiRunType
  usage: UsageSummary!
  scanResult(scanId: UUID!, language: String = null): ResultCompositeType
}

type ResultCompositeType {
  scan: ScanType!
  activeAnalysis: AnalysisRevisionType
  result: CareResultType
  garment: GarmentType
  identityCandidates: [IdentityCandidateType!]!
}

type ScanConnection {
  items: [ScanType!]!
  pageInfo: PageInfo!
}

type ScanImageMetadataType {
  id: UUID!
  role: String!
  displayOrder: Int!
  width: Int
  height: Int
}

type ScanType {
  id: UUID!
  status: String!
  requestedLanguage: String!
  progressPercent: Int!
  analysisStage: String
  errorCode: String
  garmentId: UUID
  createdAt: DateTime!
}

type ServiceEventType {
  id: UUID!
  kind: String!
  note: String
  createdAt: DateTime!
}

scalar UUID

type UsageSummary {
  modelRunCount: Int!
  estimatedCostUsd: String!
}
